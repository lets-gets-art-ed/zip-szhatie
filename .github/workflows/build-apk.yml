name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сборка
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ZIP-Szhatie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-Szhatie-apk
          path: ZIP-Szhatie.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ZIP Сжатие — последняя версия
          body: Скачайте ZIP-Szhatie.apk и откройте его на телефоне, чтобы установить.
          make_latest: true
          files: ZIP-Szhatie.apk
