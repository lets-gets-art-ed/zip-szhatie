plugins {
    id 'com.android.application'
}

android {
    namespace 'fi.ilmavirta.zip'
    compileSdk 35

    defaultConfig {
        applicationId 'fi.ilmavirta.zip'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
